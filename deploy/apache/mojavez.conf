# =================================================================
# Mojavez — Apache VirtualHost (پیکربندی تولید — سامانه خصوصی)
# -----------------------------------------------------------------
# نصب:
#   ۱) این فایل را در /etc/apache2/sites-available/mojavez.conf کپی کنید.
#   ۲) در صورت نیاز، مسیر /var/www/Mojavez را به مسیر واقعی پروژه تغییر دهید.
#   ۳) فعال‌سازی: a2ensite mojavez && systemctl reload apache2
#   ۴) ماژول‌های لازم: a2enmod rewrite headers deflate expires
# =================================================================

<VirtualHost *:80>
    ServerName mojavez.local
    ServerAlias www.mojavez.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/Mojavez/public

    # --- مسیریابی ---
    <Directory /var/www/Mojavez/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- غیرفعال‌سازی دسترسی مستقیم به پوشه‌های حساس ---
    <Directory /var/www/Mojavez/app>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/core>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/config>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/database>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/uploads>
        # فایل‌های کاربران فقط از طریق DocumentController سرو می‌شوند
        Require all denied
    </Directory>

    # --- مدیریت فایل‌های بارگذاری‌شده توسط PHP ---
    # اگر بخواهید فایل‌ها از طریق Apache با X-Sendfile سرو شوند:
    # XSendFile On
    # XSendFilePath /var/www/Mojavez/uploads

    # --- لاگ‌ها ---
    ErrorLog  ${APACHE_LOG_DIR}/mojavez_error.log
    CustomLog ${APACHE_LOG_DIR}/mojavez_access.log combined

    # --- حداکثر حجم آپلود (هم‌خوان با MAX_UPLOAD_SIZE در config.php) ---
    php_value upload_max_filesize 2M
    php_value post_max_size       8M
    php_value memory_limit        256M

    # --- امنیت: مخفی‌کردن نسخهٔ Apache و PHP ---
    ServerTokens Prod
    ServerSignature Off
    php_flag expose_php Off

    # =========================================================================
    # هدرهای امنیتی و حریم خصوصی (سامانه خصوصی)
    # =========================================================================
    # X-Robots-Tag — این سامانه خصوصی است و نباید ایندکس شود.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"

    # جلوگیری از Clickjacking و sniffing نوع محتوا
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    # سیاست Referrer
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # غیرفعال‌سازی APIهای حساس مرورگر
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"

    # Content-Security-Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"

    # Cross-Origin Protection
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-site"

    # Cache-Control پیش‌فرض برای صفحات پویا
    Header always set Cache-Control "no-store, no-cache, must-revalidate"

    # =========================================================================
    # مسدودسازی موتورهای جستجو و خزنده‌های هوش مصنوعی
    # =========================================================================
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTP_USER_AGENT} (Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|ia_archiver|Applebot|Twitterbot|LinkedInBot|WhatsApp|TelegramBot|Discordbot|SkypeUriPreview) [NC,OR]
        RewriteCond %{HTTP_USER_AGENT} (GPTBot|ChatGPT-User|CCBot|anthropic-ai|Claude-Web|cohere-ai|Google-Extended|PerplexityBot|Amazonbot|Bytespider|Diffbot|FacebookBot|Meta-ExternalAgent|OAI-SearchBot|Applebot-Extended) [NC,OR]
        RewriteCond %{HTTP_USER_AGENT} (SemrushBot|AhrefsBot|MJ12bot|DotBot|BLEXBot|SeznamBot|PetalBot) [NC,OR]
        RewriteCond %{HTTP_USER_AGENT} (spider|crawler|scraping|wget|curl|python-requests|libwww-perl) [NC]
        RewriteRule ^ - [R=410,L]
    </IfModule>

    # --- صفحهٔ سفارشی برای کد ۴۱۰ (بات‌های مسدودشده) ---
    ErrorDocument 410 "<!DOCTYPE html><html lang='fa' dir='rtl'><head><meta charset='UTF-8'><title>دسترسی مسدود</title></head><body><h1>۴۱۰ — دسترسی برای خزنده‌ها مسدود است</h1><p>این سامانه خصوصی است.</p></body></html>"

    # --- صفحات خطای سفارشی ---
    ErrorDocument 403 "<!DOCTYPE html><html lang='fa' dir='rtl'><head><meta charset='UTF-8'><title>دسترسی ممنوع</title></head><body><h1>۴۰۳ — دسترسی ممنوع</h1></body></html>"
    ErrorDocument 404 "<!DOCTYPE html><html lang='fa' dir='rtl'><head><meta charset='UTF-8'><title>یافت نشد</title></head><body><h1>۴۰۴ — صفحه یافت نشد</h1></body></html>"

    # --- HTTP → HTTPS (در صورت فعال‌بودن SSL) ---
    # <IfModule mod_rewrite.c>
    #     RewriteEngine On
    #     RewriteCond %{HTTPS} off
    #     RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    # </IfModule>
</VirtualHost>

