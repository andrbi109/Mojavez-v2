# =================================================================
# Mojavez — Apache VirtualHost (پیکربندی تولید)
# -----------------------------------------------------------------
# نصب:
#   ۱) این فایل را در /etc/apache2/sites-available/mojavez.conf کپی کنید.
#   ۲) در صورت نیاز، مسیر /var/www/Mojavez را به مسیر واقعی پروژه تغییر دهید.
#   ۳) فعال‌سازی: a2ensite mojavez && systemctl reload apache2
#   ۴) ماژول‌های لازم: a2enmod rewrite headers deflate expires
# =================================================================

<VirtualHost *:80>
    ServerName mojavez.local
    ServerAlias www.mojavez.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/Mojavez/public

    # --- مسیریابی ---
    <Directory /var/www/Mojavez/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- غیرفعال‌سازی دسترسی مستقیم به پوشه‌های حساس ---
    <Directory /var/www/Mojavez/app>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/core>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/config>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/database>
        Require all denied
    </Directory>
    <Directory /var/www/Mojavez/uploads>
        # فایل‌های کاربران فقط از طریق DocumentController سرو می‌شوند
        Require all denied
    </Directory>

    # --- مدیریت فایل‌های بارگذاری‌شده توسط PHP ---
    # اگر بخواهید فایل‌ها از طریق Apache با X-Sendfile سرو شوند:
    # XSendFile On
    # XSendFilePath /var/www/Mojavez/uploads

    # --- لاگ‌ها ---
    ErrorLog  ${APACHE_LOG_DIR}/mojavez_error.log
    CustomLog ${APACHE_LOG_DIR}/mojavez_access.log combined

    # --- حداکثر حجم آپلود (هم‌خوان با MAX_UPLOAD_SIZE در config.php) ---
    php_value upload_max_filesize 2M
    php_value post_max_size       8M
    php_value memory_limit        128M

    # --- امنیت: مخفی‌کردن نسخهٔ Apache ---
    ServerTokens Prod
    ServerSignature Off

    # --- HTTP → HTTPS (در صورت فعال‌بودن SSL) ---
    # <IfModule mod_rewrite.c>
    #     RewriteEngine On
    #     RewriteCond %{HTTPS} off
    #     RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    # </IfModule>
</VirtualHost>

