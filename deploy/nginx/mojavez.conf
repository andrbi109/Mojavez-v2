# =================================================================
# Mojavez — Nginx Server Block (پیکربندی تولید — سامانه خصوصی)
# -----------------------------------------------------------------
# نصب:
#   ۱) این فایل را در /etc/nginx/sites-available/mojavez کپی کنید.
#   ۲) سیم‌لینک: ln -s /etc/nginx/sites-available/mojavez /etc/nginx/sites-enabled/
#   ۳) در صورت نیاز، مسیر /var/www/Mojavez را به مسیر واقعی پروژه تغییر دهید.
#   ۴) تست: nginx -t
#   ۵) بارگذاری مجدد: systemctl reload nginx
#
# نکته: چون Mojavec با فایل .htaccess Apache کار می‌کند، قواعد مسیریابی
# معادل آن در Nginx زیر بازنویسی شده‌اند.
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mojavez.local www.mojavez.local;

    # اگر SSL فعال است، درخواست‌های HTTP را به HTTPS هدایت کنید:
    # return 301 https://$host$request_uri;

    root /var/www/Mojavez/public;
    index index.php index.html;

    charset utf-8;

    # --- کاراکترست و MIME ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- لاگ‌ها ---
    access_log /var/log/nginx/mojavez_access.log;
    error_log  /var/log/nginx/mojavez_error.log;

    # --- امنیت: مخفی‌کردن نسخهٔ Nginx ---
    server_tokens off;

    # --- حداکثر حجم آپلود ---
    client_max_body_size 8M;

    # =========================================================================
    # هدرهای امنیتی و حریم خصوصی (سامانه خصوصی)
    # =========================================================================
    # X-Robots-Tag — این سامانه خصوصی است و نباید ایندکس شود.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # جلوگیری از Clickjacking و sniffing نوع محتوا
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # سیاست Referrer — فقط origin در صورت خروج از سایت
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # غیرفعال‌سازی APIهای حساس مرورگر
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

    # Content-Security-Policy — فقط منابع same-origin (به‌علاوهٔ Bootstrap CDN اگر USE_CDN=true)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Cross-Origin Protection (Spectre-class mitigations)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # HSTS فقط روی HTTPS فعال شود
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cache-Control پیش‌فرض برای صفحات پویا — جلوگیری از کش داده‌های حساس
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # =========================================================================
    # مسدودسازی موتورهای جستجو و خزنده‌های هوش مصنوعی
    # =========================================================================
    # اگر User-Agent در فهرست بات‌ها بود، کد ۴۱۰ برگردان.
    if ($http_user_agent ~* (Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|Exabot|facebot|ia_archiver|Applebot|Twitterbot|LinkedInBot|WhatsApp|TelegramBot|Discordbot|SkypeUriPreview|GPTBot|ChatGPT-User|CCBot|anthropic-ai|Claude-Web|cohere-ai|Google-Extended|PerplexityBot|Amazonbot|Bytespider|Diffbot|FacebookBot|Meta-ExternalAgent|OAI-SearchBot|Applebot-Extended|SemrushBot|AhrefsBot|MJ12bot|DotBot|BLEXBot|SeznamBot|PetalBot|PetalBot|spider|crawler|scraping|wget|curl|python-requests|libwww-perl)) {
        return 410;
    }

    # --- مسیریابی (معادل .htaccess) ---
    location / {
        try_files $uri $uri/ /index.php?url=$uri&$args;
    }

    # --- فایل‌های استاتیک — کش طولانی با cache busting (پارامتر ?v=...) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- robots.txt و فایل‌های متنی استاتیک — بدون کش ---
    location = /robots.txt {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        # در صورت استفاده از PHP-FPM از طریق Unix socket:
        # fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # یا از طریق TCP (پیش‌فرض در داکر و تنظیمات ساده‌تر):
        fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # بافرهای بزرگ‌تر برای بارگذاری مدارک
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;

        # پاس‌دادن هدرهای امنیتی به PHP-FPM (توسط خود اسکریپت تولید می‌شود)
        fastcgi_param HTTPS $https if_not_empty;
    }

    # --- غیرفعال‌سازی لاگ برای favicon ---
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # --- دسترسی به فایل‌های مخفی ممنوع ---
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- مسدودسازی دسترسی مستقیم به فایل‌های حساس ---
    location ~* \.(sql|md|py|sh|json|lock|log|bak|env|yaml|yml|ini|conf)$ {
        deny all;
    }

    # --- مسدودسازی دسترسی به پوشه‌های حساس ---
    location ~ ^/(app|core|config|database|tests|tools|docs|uploads)(/|$) {
        deny all;
        return 403;
    }

    # --- پاسخ سفارشی برای کد ۴۱۰ (بات‌های مسدودشده) ---
    error_page 410 = @blocked_bot;
    location @blocked_bot {
        default_type text/html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 410 "<!DOCTYPE html><html lang='fa' dir='rtl'><head><meta charset='UTF-8'><title>دسترسی مسدود</title></head><body><h1>۴۱۰ — دسترسی برای خزنده‌ها مسدود است</h1><p>این سامانه خصوصی است.</p></body></html>";
    }
}

