# =================================================================
# Mojavez — Nginx Server Block (پیکربندی تولید)
# -----------------------------------------------------------------
# نصب:
#   ۱) این فایل را در /etc/nginx/sites-available/mojavez کپی کنید.
#   ۲) سیم‌لینک: ln -s /etc/nginx/sites-available/mojavez /etc/nginx/sites-enabled/
#   ۳) در صورت نیاز، مسیر /var/www/Mojavez را به مسیر واقعی پروژه تغییر دهید.
#   ۴) تست: nginx -t
#   ۵) بارگذاری مجدد: systemctl reload nginx
#
# نکته: چون Mojavez با فایل .htaccess Apache کار می‌کند، قواعد مسیریابی
# معادل آن در Nginx زیر بازنویسی شده‌اند.
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mojavez.local www.mojavez.local;

    # اگر SSL فعال است، درخواست‌های HTTP را به HTTPS هدایت کنید:
    # return 301 https://$host$request_uri;

    root /var/www/Mojavez/public;
    index index.php index.html;

    charset utf-8;

    # --- کاراکترست و MIME ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- لاگ‌ها ---
    access_log /var/log/nginx/mojavez_access.log;
    error_log  /var/log/nginx/mojavez_error.log;

    # --- امنیت: مخفی‌کردن نسخهٔ Nginx ---
    server_tokens off;

    # --- حداکثر حجم آپلود ---
    client_max_body_size 8M;

    # --- هدرهای امنیتی ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # فقط روی HTTPS

    # --- مسیریابی (معادل .htaccess) ---
    location / {
        try_files $uri $uri/ /index.php?url=$uri&$args;
    }

    # --- فایل‌های استاتیک ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1w;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        # در صورت استفاده از PHP-FPM از طریق Unix socket:
        # fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # یا از طریق TCP (پیش‌فرض در داکر و تنظیمات ساده‌تر):
        fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # بافرهای بزرگ‌تر برای بارگذاری مدارک
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    # --- غیرفعال‌سازی لاگ برای favicon ---
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # --- دسترسی به فایل‌های مخفی ممنوع ---
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- مسدودسازی دسترسی مستقیم به فایل‌های حساس ---
    location ~* \.(sql|md|py|sh|json|lock|log|bak|env)$ {
        deny all;
    }

    # --- مسدودسازی دسترسی به پوشه‌های حساس ---
    location ~ ^/(app|core|config|database|tests|tools|docs|uploads)(/|$) {
        deny all;
        return 403;
    }
}

