; =================================================================
; Mojavez — توصیه‌های PHP برای محیط تولید (Production)
; -----------------------------------------------------------------
; این فایل یک راهنما است. می‌توانید مقادیر آن را در php.ini یا
; در فایل pool کاربر PHP-FPM (www.conf) اعمال کنید.
;
; نصب روی PHP-FPM:
;   sudo cp deploy/php/mojavez.production.ini /etc/php/8.2/fpm/conf.d/99-mojavez.ini
;   sudo systemctl reload php8.2-fpm
;
; نصب روی mod_php (Apache):
;   sudo cp deploy/php/mojavez.production.ini /etc/php/8.2/apache2/conf.d/99-mojavez.ini
;   sudo systemctl reload apache2
;
; این فایل به‌صورت idempotent طراحی شده — مقادیر آن بر هر پیکربندی
; پیش‌فرض PHP غلبه می‌کند.
; =================================================================

; ==================== OPcache (شتاب‌دهی bytecode) ====================
; بدون OPcache، هر درخواست PHP را از نو تفسیر می‌کند — سرعت دو تا پنج برابر
; افت می‌کند. در محیط تولید حتماً فعال باشد.
opcache.enable = 1
opcache.enable_cli = 0
; مقدار حافظهٔ اختصاص‌یافته (مگابایت) — ۱۲۸ مگابایت برای این پروژه کافی است.
opcache.memory_consumption = 128
; تعداد بایت‌های اختصاص‌یافته برای رشته‌های interned (پیش‌فرض ۸MB).
opcache.interned_strings_buffer = 16
; حداکثر تعداد فایل‌های قابل کش (پیش‌فرض ۱۰۰۰۰ — برای پروژه‌های متوسط کافی است).
opcache.max_accelerated_files = 20000
; اعتبارسنجی زمان‌変更 فایل‌ها — در محیط تولید ۰ (بدون بررسی) برای حداکثر سرعت.
; هنگام انتشار نسخهٔ جدید، باید OPcache را پاک کنید (opcache_reset یا restart PHP-FPM).
opcache.validate_timestamps = 0
; ذخیرهٔ دوبارهٔ کامنت‌ها و داکیومنت‌ها — در تولید لازم نیست.
opcache.save_comments = 0
; سریع‌تر بودن به‌وسیلهٔ مثبت‌بودن APIهای unsafe (در محیط تولید امن است).
opcache.fast_shutdown = 1

; ==================== Realpath Cache (شتاب‌دهی مسیر فایل‌ها) ====================
; برای autoloader که مسیرهای مطلق زیاد را resolve می‌کند، حیاتی است.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ==================== حافظه و زمان اجرا ====================
; این سامانه آپلود فایل تا ۲ مگابایت و ایمپورت CSV تا ۵ مگابایت دارد.
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 5000

; ==================== آپلود فایل ====================
; هم‌خوان با MAX_UPLOAD_SIZE در config.php.
upload_max_filesize = 8M
post_max_size = 12M

; ==================== امنیت — مخفی‌کردن جزئیات PHP ====================
; در پاسخ HTTP، هدر X-Powered-On چاپ نشود.
expose_php = Off

; نمایش خطا — در تولید همیشه خاموش.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/mojavez-error.log

; ==================== مسیر ذخیرهٔ نشست (بدون التزام به /tmp) ====================
; پیشنهاد: نشست‌ها را در مسیری خارج از DocumentRoot و قابل دسترس فقط برای کاربر www-data نگه دارید.
; session.save_path = "/var/lib/php/mojavez-sessions"
session.save_handler = files
session.gc_maxlifetime = 86400
session.gc_probability = 1
session.gc_divisor = 100
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.use_strict_mode = On
session.use_only_cookies = On

; ==================== تنظیمات خروجی ====================
; بافر خروجی برای کاهش TTFB (Time To First Byte).
output_buffering = 4096
; فشرده‌سازی خودکار خروجی با gzip.
zlib.output_compression = On
zlib.output_compression_level = 6
