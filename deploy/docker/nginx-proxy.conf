# ============================================================
# nginx-proxy.conf — پیکربندی Nginx به‌عنوان reverse proxy
# ------------------------------------------------------------
# این فایل در کانتینر web به مسیر /etc/nginx/conf.d/default.conf
# مونت می‌شود و درخواست‌ها را به سرویس app (Apache روی پورت ۸۰)
# پروکسی می‌کند.
#
# وظایف اصلی:
#   - پروکسی ترافیک HTTP به Apache
#   - حفظ هدرهای مهم (Host, X-Real-IP, X-Forwarded-*)
#   - سرو مستقیم فایل‌های استاتیک سبک (با cache-Control)
#   - هدرهای امنیتی پایه
#   - timeouts و حداکثر اندازهٔ آپلود منطبق با سامانه
# ============================================================

# upstream: نام سرویس app در docker-compose و پورت داخلی آن
upstream mojavez_app {
    server app:80;

    # نگه‌داشت اتصال برای کارایی بهتر
    keepalive 32;
}

# ------------------------------------------------------------
# سرور اصلی — پورت ۸۰ (که به پورت میزبان MOJAVEZ_PORT مپ می‌شود)
# ------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # نام سرور — در صورتی که دامنه دارید، اینجا قرار دهید
    server_name _;

    # حداکثر اندازهٔ آپلود — منطبق با MAX_UPLOAD_SIZE در پروژه (۲MB)
    # کمی بزرگتر در نظر گرفته شده تا سربار multipart هدرها پوشش داده شود
    client_max_body_size 8m;

    # timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # لاگ‌ها
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # مسیر پیش‌فرض
    location / {
        proxy_pass http://mojavez_app;

        # HTTP/1.1 برای keepalive و وب‌سوکت‌های احتمالی
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # نگه‌داشت اتصال به upstream
        proxy_set_header Connection        "";

        # timeouts پروکسی
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # هدرهای امنیتی پایه (به‌عنوان لایهٔ تکمیلی روی Apache)
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ----------------------------------------------------------
    # فایل‌های استاتیک: مستقیماً توسط nginx سرو می‌شوند
    # (فقط در صورتی که volume اشتراکی assets داشته باشید؛ در غیر
    # این‌صورت، این بلوک به Apache پاس داده می‌شود).
    # نکته: چون assets در داخل کانتینر app است و nginx به آن‌ها دسترسی
    # ندارد، این بلوک به‌صورت پیش‌فرض غیرفعال است و همه چیز پروکسی می‌شود.
    # ----------------------------------------------------------
    # location ~* \.(?:css|js|woff2?|ttf|png|jpe?g|gif|svg|ico|map)$ {
    #     proxy_pass http://mojavez_app;
    #     proxy_cache_valid 200 1h;
    #     expires 1h;
    #     add_header Cache-Control "public, max-age=3600";
    # }

    # ----------------------------------------------------------
    # سلامت (healthcheck داخلی nginx)
    # ----------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------------------------
    # مسدودسازی دسترسی به فایل‌های حساس (لایهٔ دفاعی اضافی)
    #   این الگوها در Apache هم محافظت می‌شوند، ولی تکرار لایه امنیتی است.
    # ----------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(\.env|\.git|\.htaccess|composer\.(json|lock)|README\.md) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # صفحهٔ خطای پیش‌فرض اگر upstream در دسترس نباشد
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        default_type text/html;
        return 502 '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">'
                   '<title>سرویس موقتاً در دسترس نیست</title></head><body style="font-family:Tahoma,sans-serif;'
                   'text-align:center;padding:3rem">'
                   '<h2>⚠️ سرویس موقتاً در دسترس نیست</h2>'
                   '<p>لطفاً چند لحظه بعد تلاش کنید.</p></body></html>';
    }
}
